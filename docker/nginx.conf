# nginx server block for the agent-simulator UI container.
# Serves the Vite-built static files on port 8080 and proxies all
# /api calls — including the WebSocket stream — to simulator-api:8000.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy ─────────────────────────────────────────────────────────
    # Covers both REST (/api/...) and the WebSocket stream (/api/run/stream).
    # The Upgrade/Connection headers are always forwarded; nginx ignores them
    # for plain HTTP and the backend upgrades only when the client requests it.
    location /api {
        proxy_pass         http://simulator-api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Keep long-lived WebSocket connections open
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # Health check pass-through (used by Docker health checks)
    location /health {
        proxy_pass http://simulator-api:8000;
    }

    # ── SPA catch-all ────────────────────────────────────────────────────
    # Any URL that does not match a real file falls back to index.html so
    # React Router handles client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
