simulator:
  concurrency: 200
  run_duration_seconds: 600
  clock_multiplier: 5.0
  random_seed: 42

agent_profiles:
  rag_researcher:
    mix_weight: 3.0
    tools:
      - vector_search
      - reranker
      - summariser
    llm_model: "gpt-4o"
    llm_input_tokens:
      mean: 1200
      std: 300
    llm_output_tokens:
      mean: 250
      std: 80
    planning_latency_ms:
      mean: 200
      std: 50
    tool_call_count:
      min: 1
      max: 5
    failure_rate: 0.05
    observability_attributes:
      session:
        retrieval.score:    {type: float,   min: 0.6,  max: 1.0}
        chunks.returned:    {type: int,     min: 1,    max: 20}
        reranker.model:     {type: enum,    values: [cohere-v3, bge-reranker]}
        index.name:         {type: enum,    values: [prod-index, staging-index]}
      tool:
        tool.input_size_kb: {type: float,   min: 0.5,  max: 50.0}
        tool.cache_hit:     {type: boolean, probability: 0.3}
      inference:
        inference.temperature: {type: float, min: 0.0, max: 1.0}
        inference.top_p:       {type: float, min: 0.8, max: 1.0}
    behavioral_signals:
      planning_quality:
        type: float
        span: planning
        mean: 0.85
        std: 0.10
        min: 0.0
        max: 1.0
      tool_selection_quality:
        type: float
        span: tool
        mean: 0.85
        std: 0.10
        min: 0.0
        max: 1.0
      tool_sequence:
        enforced: true
        order: [vector_search, reranker, summariser]
        deviation_probability: 0.05
      goal_drift:
        type: boolean
        span: session
        probability: 0.05
      retry_reason:
        type: enum
        span: tool
        values: [rate_limit, timeout, bad_output, network_error]
        emitted_on_retry: true

  code_executor:
    mix_weight: 2.0
    tools:
      - code_interpreter
      - shell
      - file_writer
    llm_model: "gpt-4o"
    llm_input_tokens:
      mean: 900
      std: 200
    llm_output_tokens:
      mean: 600
      std: 150
    planning_latency_ms:
      mean: 300
      std: 80
    tool_call_count:
      min: 2
      max: 8
    failure_rate: 0.10
    observability_attributes:
      session:
        execution.language: {type: enum,  values: [python, javascript, bash]}
        sandbox.type:       {type: enum,  values: [docker, e2b, local]}
      tool:
        execution.exit_code:  {type: int,   values: [0, 1, 2]}
        execution.runtime_ms: {type: float, min: 10, max: 5000}
        execution.memory_mb:  {type: float, min: 10, max: 512}
      inference:
        inference.temperature: {type: float, min: 0.0, max: 0.5}
    behavioral_signals:
      tool_selection_quality:
        type: float
        span: tool
        mean: 0.75
        std: 0.20
        min: 0.0
        max: 1.0
      goal_drift:
        type: boolean
        span: session
        probability: 0.08
      sandbox_escalation:
        type: boolean
        span: tool
        probability: 0.05
        description: "Agent switches from local to docker sandbox mid-session"

  web_scraper:
    mix_weight: 2.0
    tools:
      - http_fetch
      - html_parser
      - link_extractor
    llm_model: "claude-3-sonnet"
    llm_input_tokens:
      mean: 800
      std: 200
    llm_output_tokens:
      mean: 150
      std: 50
    planning_latency_ms:
      mean: 100
      std: 30
    tool_call_count:
      min: 3
      max: 10
    failure_rate: 0.08
    observability_attributes:
      session:
        pages.scraped:    {type: int,   min: 1,   max: 20}
        content.size_kb:  {type: float, min: 1.0, max: 500.0}
      tool:
        http.status_code:     {type: enum,    values: [200, 301, 404, 429, 503]}
        http.response_ms:     {type: float,   min: 50,  max: 3000}
        robots.txt.respected: {type: boolean, probability: 0.95}
      inference:
        inference.temperature: {type: float, min: 0.0, max: 1.0}
    behavioral_signals:
      tool_selection_quality:
        type: float
        span: tool
        mean: 0.70
        std: 0.15
        min: 0.0
        max: 1.0
      goal_drift:
        type: boolean
        span: session
        probability: 0.12
      model_switch:
        type: boolean
        span: inference
        probability: 0.03
        target_model: "gpt-4o"

  data_analyst:
    mix_weight: 2.0
    tools:
      - sql_query
      - dataframe_ops
      - chart_generator
    llm_model: "gpt-4o"
    llm_input_tokens:
      mean: 3000
      std: 800
    llm_output_tokens:
      mean: 400
      std: 100
    planning_latency_ms:
      mean: 250
      std: 60
    tool_call_count:
      min: 2
      max: 6
    failure_rate: 0.04
    observability_attributes:
      session:
        rows.processed:   {type: int,  min: 100,  max: 1000000}
        query.complexity: {type: enum, values: [simple, moderate, complex]}
      tool:
        query.execution_ms:  {type: float, min: 10,  max: 10000}
        query.rows_returned: {type: int,   min: 0,   max: 100000}
        db.type:             {type: enum,  values: [postgres, bigquery, snowflake]}
      inference:
        inference.temperature: {type: float, min: 0.0, max: 0.3}
    behavioral_signals:
      planning_quality:
        type: float
        span: planning
        mean: 0.80
        std: 0.15
        min: 0.0
        max: 1.0
      tool_selection_quality:
        type: float
        span: tool
        mean: 0.80
        std: 0.10
        min: 0.0
        max: 1.0
      goal_drift:
        type: boolean
        span: session
        probability: 0.04

  api_orchestrator:
    mix_weight: 1.0
    tools:
      - rest_call
      - auth_handler
      - response_parser
    llm_model: "claude-3-haiku"
    llm_input_tokens:
      mean: 400
      std: 100
    llm_output_tokens:
      mean: 80
      std: 30
    planning_latency_ms:
      mean: 50
      std: 15
    tool_call_count:
      min: 1
      max: 4
    failure_rate: 0.03
    observability_attributes:
      session:
        api.calls_made:   {type: int,  min: 1,  max: 20}
        auth.method:      {type: enum, values: [oauth2, api_key, basic]}
      tool:
        http.status_code: {type: enum,    values: [200, 201, 400, 401, 429, 500]}
        http.response_ms: {type: float,   min: 10, max: 2000}
        api.retry_count:  {type: int,     min: 0,  max: 3}
        api.cache_hit:    {type: boolean, probability: 0.4}
      inference:
        inference.temperature: {type: float, min: 0.0, max: 0.2}
    behavioral_signals:
      planning_quality:
        type: float
        span: planning
        mean: 0.90
        std: 0.08
        min: 0.0
        max: 1.0
      goal_drift:
        type: boolean
        span: session
        probability: 0.03
      replanning_triggered:
        type: boolean
        span: session
        probability: 0.12
        description: "Agent discards original plan and replans mid-session"

scenarios:
  enabled:
    tool_timeout: 0.05
    infinite_retry_loop: 0.03
    goal_drift: 0.04
    context_overflow: 0.02
    silent_failure: 0.04

# Prices in USD per 1M tokens. Update here — no code changes required.
pricing:
  gpt-4o:
    input_per_million:        2.50
    output_per_million:       10.00
    cached_input_per_million: 1.25
  gpt-4o-mini:
    input_per_million:        0.15
    output_per_million:       0.60
    cached_input_per_million: 0.075
  claude-3-sonnet:
    input_per_million:        3.00
    output_per_million:       15.00
    cache_write_per_million:  3.75
    cache_read_per_million:   0.30
  claude-3-haiku:
    input_per_million:        0.25
    output_per_million:       1.25
    cache_write_per_million:  0.30
    cache_read_per_million:   0.03
  gemini-1.5-pro:
    input_per_million:        1.25
    output_per_million:       5.00
  gemini-1.5-flash:
    input_per_million:        0.075
    output_per_million:       0.30

telemetry:
  exporter_endpoint: "http://localhost:4317"
  batch_size: 512
  export_interval_ms: 5000

validation:
  enabled: false
  real_export_path: null
  profile_to_validate: null
  tolerance:
    value_range_margin: 0.20
    missing_attribute_threshold: 0.05
