# config/schemas/langgraph_multi_agent.yaml
# Pre-built simulator profile for a LangGraph multi-agent system.
# Models a supervisor + specialist agent graph with node routing and handoffs.
# Derived from real OTel exports of LangGraph agents.

simulator:
  concurrency: 5
  run_duration_seconds: 60
  clock_multiplier: 5.0

scenarios:
  enabled:
    tool_timeout: 0.04
    infinite_retry_loop: 0.02
    goal_drift: 0.0   # controlled per-profile below

agent_profiles:
  langgraph_multi_agent:
    mix_weight: 1.0
    tools: [supervisor, researcher, coder, critic]
    llm_model: "gpt-4o"
    llm_input_tokens:    {mean: 1800, std: 500}
    llm_output_tokens:   {mean: 380,  std: 120}
    planning_latency_ms: {mean: 280,  std: 70}
    tool_call_count:     {min: 3, max: 8}
    failure_rate: 0.06

    observability_attributes:
      session:
        graph.nodes.visited:      {type: int,   min: 2,  max: 15}
        graph.cycles.detected:    {type: int,   min: 0,  max: 5}
        graph.final.node:         {type: enum,  values: [END, supervisor, researcher, coder, critic]}
        context.messages.count:   {type: int,   min: 2,  max: 40}
      tool:
        node.name:                {type: enum,  values: [supervisor, researcher, coder, critic, tools]}
        node.iteration:           {type: int,   min: 1,  max: 10}
        state.keys.updated:       {type: int,   min: 1,  max: 8}
      inference:
        agent.role:               {type: enum,  values: [supervisor, researcher, coder, critic]}
        handoff.target:           {type: enum,  values: [researcher, coder, critic, END]}

    behavioral_signals:
      tool_selection_quality:
        type: float
        span: tool
        mean: 0.80
        std: 0.12
        min: 0.0
        max: 1.0
      goal_drift:
        type: boolean
        span: session
        probability: 0.07
      replanning_triggered:
        type: boolean
        span: session
        probability: 0.15
        description: "Supervisor discards specialist result and re-routes"
      planning_quality:
        type: float
        span: planning
        mean: 0.78
        std: 0.14
        min: 0.0
        max: 1.0
      retry_reason:
        type: enum
        span: tool
        values: [bad_output, timeout, handoff_refused, max_iterations]
        emitted_on_retry: true

telemetry:
  exporter_endpoint: "http://localhost:4317"
  batch_size: 512
  export_interval_ms: 5000

pricing:
  gpt-4o:
    input_per_million:        2.50
    output_per_million:       10.00
    cached_input_per_million: 1.25

validation:
  enabled: false
  real_export_path: null
  profile_to_validate: null
  tolerance:
    value_range_margin: 0.20
    missing_attribute_threshold: 0.05
